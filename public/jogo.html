<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crônicas de Aetherion</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Courier New',monospace; touch-action:none; }
  #game { display:block; width:100vw; height:100vh; image-rendering:pixelated; }

  #hud { position:fixed; left:0; right:0; bottom:0; padding:6px 10px; background:rgba(16,14,10,.93); border-top:2px solid #6b5a3e; color:#e8dcc0; font-size:13px; z-index:10; user-select:none; }
  .bars { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bar { position:relative; height:14px; border:1px solid #000; background:#3a1010; width:104px; box-shadow:0 0 0 1px #6b5a3e; }
  .bar > i { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(#e04b4b,#8d1f1f); transition:width .2s; }
  .bar.mp { background:#102a3a; } .bar.mp > i { background:linear-gradient(#4b9ae0,#1f5a8d); }
  .bar.xp { background:#2a2440; } .bar.xp > i { background:linear-gradient(#a08cf0,#5c48b8); }
  .bar span { position:absolute; width:100%; text-align:center; font-size:10px; line-height:14px; color:#fff; text-shadow:1px 1px 0 #000; }
  #log { margin-top:4px; font-size:11px; color:#c9b98a; min-height:14px; }

  #dpad { position:fixed; left:14px; bottom:150px; z-index:11; user-select:none; }
  #dpad button, .actbtn { width:52px; height:52px; border:2px solid #6b5a3e; background:rgba(24,20,15,.78); color:#e8dcc0; font-size:20px; border-radius:10px; touch-action:none; }
  #dpad button:active, .actbtn:active { background:#6b5a3e; }
  #dpad .row { display:flex; gap:52px; justify-content:center; }
  #dpad .mid { display:flex; }
  #actions { position:fixed; right:14px; bottom:150px; z-index:11; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .actbtn { width:60px; height:60px; border-radius:50%; font-size:24px; position:relative; }
  /* inset:auto 0 0 0 em vez de inset:0 — assim a altura definida por JS
     realmente controla o quanto da bolinha fica coberto, subindo do pé. */
  .actbtn .cd { position:absolute; inset:auto 0 0 0; border-radius:50%; background:rgba(0,0,0,.6); display:none; }
  .actbtn small { position:absolute; bottom:-2px; right:0; font-size:9px; color:#9ad; }

  #topbar { position:fixed; top:8px; left:0; right:0; text-align:center; z-index:9; pointer-events:none; }
  #region { color:#f0d060; font-size:13px; text-shadow:1px 1px 0 #000; font-weight:bold; }
  #online { color:#7dd87d; font-size:11px; text-shadow:1px 1px 0 #000; margin-top:2px; }
  #conexao { position:fixed; top:8px; right:10px; z-index:12; font-size:11px; padding:3px 8px; border-radius:10px; background:rgba(0,0,0,.6); color:#7dd87d; border:1px solid #35301f; }
  #conexao.ruim { color:#e0c040; } #conexao.caiu { color:#e04b4b; }

  /* chat */
  #chatbox { position:fixed; left:10px; bottom:96px; z-index:11; width:min(52vw,300px); pointer-events:none; }
  #chatlog { max-height:110px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; font-size:11px; }
  #chatlog div { color:#e8dcc0; text-shadow:1px 1px 0 #000; }
  #chatlog b { color:#7dd87d; }
  #chatform { display:flex; gap:6px; margin-top:5px; pointer-events:auto; }
  #chatin { flex:1; min-width:0; padding:6px 8px; font-family:inherit; font-size:12px; background:rgba(16,14,10,.9); border:1px solid #6b5a3e; border-radius:6px; color:#e8dcc0; }
  #chatform button { border:1px solid #6b5a3e; background:#2a241a; color:#f0d060; border-radius:6px; font-family:inherit; font-size:12px; padding:0 10px; }

  /* modais */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:20; display:none; align-items:center; justify-content:center; }
  .modal.open { display:flex; }
  .box { background:#1e1a14; border:3px solid #6b5a3e; border-radius:8px; padding:14px; width:min(92vw,400px); color:#e8dcc0; max-height:80vh; overflow-y:auto; }
  .box h3 { font-size:14px; margin-bottom:8px; color:#f0d060; display:flex; justify-content:space-between; align-items:center; }
  .box h3 button { background:none; border:none; color:#e8dcc0; font-size:16px; cursor:pointer; }
  #equipRow { display:flex; gap:6px; margin-bottom:10px; }
  .eqslot { flex:1; border:1px solid #6b5a3e; background:#141210; border-radius:6px; padding:5px; font-size:10px; text-align:center; min-height:52px; cursor:pointer; }
  .eqslot b { display:block; color:#8a7a5a; font-size:8px; margin-bottom:2px; }
  #grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .slot { border:1px solid #6b5a3e; background:#141210; border-radius:6px; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:20px; position:relative; cursor:pointer; }
  .slot small { font-size:8px; color:#c9b98a; text-align:center; line-height:1.1; }
  .slot .qty { position:absolute; bottom:2px; right:4px; font-size:9px; color:#fff; }
  #stats { margin-top:10px; font-size:11px; color:#9a8a6a; line-height:1.7; }
  .shoprow { display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px solid #35301f; font-size:12px; }
  .shoprow .ic { font-size:20px; } .shoprow .nm { flex:1; }
  .shoprow button { border:1px solid #6b5a3e; background:#2a241a; color:#f0d060; padding:6px 12px; border-radius:6px; font-family:inherit; font-size:11px; cursor:pointer; }

  #aviso { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:#e8dcc0; text-align:center; padding:24px; }
  #aviso h2 { color:#f0d060; font-size:18px; }
  #aviso p { font-size:13px; color:#9a8a6a; max-width:38ch; line-height:1.7; }
  #aviso a, #aviso button { border:2px solid #6b5a3e; background:#2a241a; color:#f0d060; padding:10px 22px; border-radius:8px; font-family:inherit; font-size:14px; text-decoration:none; cursor:pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <div id="region">carregando...</div>
  <div id="online"></div>
</div>
<div id="conexao">conectando...</div>

<div id="dpad">
  <div class="row"><button data-d="up">▲</button></div>
  <div class="mid"><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div>
</div>

<div id="actions">
  <button class="actbtn" id="bagbtn" title="Mochila (B)">🎒</button>
  <button class="actbtn" id="spellbtn" title="Magia (E)">✨<div class="cd" id="spellcd"></div><small id="spellcost"></small></button>
  <button class="actbtn" id="stopbtn" title="Parar (Esc)">✋</button>
</div>

<div id="chatbox">
  <div id="chatlog"></div>
  <form id="chatform" autocomplete="off">
    <input id="chatin" maxlength="200" placeholder="Enter para falar...">
    <button type="submit">▶</button>
  </form>
</div>

<div class="modal" id="inv"><div class="box">
  <h3>🎒 Mochila <button id="closeinv">✖</button></h3>
  <div id="equipRow">
    <div class="eqslot" data-slot="weapon"><b>ARMA</b><span>—</span></div>
    <div class="eqslot" data-slot="shield"><b>ESCUDO</b><span>—</span></div>
    <div class="eqslot" data-slot="armor"><b>ARMADURA</b><span>—</span></div>
    <div class="eqslot" data-slot="ring"><b>ANEL</b><span>—</span></div>
  </div>
  <div id="grid"></div>
  <div id="stats"></div>
</div></div>

<div class="modal" id="shop"><div class="box">
  <h3><span id="shopname">Loja</span> <button id="closeshop">✖</button></h3>
  <div id="shopgold" style="font-size:12px;color:#f0d060;margin-bottom:6px;"></div>
  <div id="shoprows"></div>
</div></div>

<div id="aviso">
  <h2 id="avisoTitulo">Entrando em Aetherion...</h2>
  <p id="avisoTexto">Conectando ao servidor.</p>
  <div id="avisoAcoes"></div>
</div>

<div id="hud">
  <div class="bars">
    <b id="nick" style="color:#f0d060"></b>
    <b>Nv <span id="lvl">1</span></b>
    <div class="bar"><i id="hpbar" style="width:100%"></i><span id="hptxt"></span></div>
    <div class="bar mp"><i id="mpbar" style="width:100%"></i><span id="mptxt"></span></div>
    <div class="bar xp"><i id="xpbar" style="width:0%"></i><span id="xptxt"></span></div>
    <b style="color:#f0d060">💰 <span id="gold">0</span></b>
  </div>
  <div id="log">Bem-vindo a Aetherion.</div>
</div>

<script type="module" src="/js/jogo.js"></script>
</body>
</html>
