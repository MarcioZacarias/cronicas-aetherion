# =========================================================
# nginx — Crônicas de Aetherion
#
# Estáticos saem daqui direto; /api e /ws vão para o Node (porta 3000).
#
# Instalar:
#   sudo cp deploy/nginx-aetherion.conf /etc/nginx/sites-available/aetherion
#   sudo ln -sf /etc/nginx/sites-available/aetherion /etc/nginx/sites-enabled/aetherion
#   sudo nginx -t && sudo systemctl reload nginx
# =========================================================

upstream aetherion_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name srv1927329.hstgr.cloud;
    root /var/www/aetherion/public;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/srv1927329.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1927329.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1M;

    # O jogo é canvas + JS: comprimir texto vale muito, PNG já vem comprimido.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- cabeçalhos de segurança ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- API ----
    location /api/ {
        proxy_pass http://aetherion_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    # ---- WebSocket do jogo ----
    # Sem o par Upgrade/Connection o nginx encerra o handshake e o jogo
    # nunca conecta. O timeout longo evita derrubar quem está parado lendo.
    location /ws {
        proxy_pass http://aetherion_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # ---- estáticos ----
    # SEM cache longo nos assets: os atlas gerados (casas.png, lpc-sets.png)
    # mudam de conteúdo sem mudar de nome, e 30 dias de cache fizeram o
    # cliente desenhar recortes de um atlas velho — casas em pedaços.
    # no-cache = revalida sempre; o nginx responde 304 quando não mudou.
    location /assets/ {
        add_header Cache-Control "no-cache";
    }

    # HTML, JS e CSS mudam a cada deploy e não têm hash no nome, então
    # precisam ser revalidados — senão o jogador fica com a versão velha.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # A versão single-player original continua acessível, servida do
    # arquivo único na raiz do repositório.
    location = /classico {
        alias /var/www/aetherion/index.html;
        default_type text/html;
        add_header Cache-Control "no-cache";
    }

    location = /CREDITS-LPC.txt {
        alias /var/www/aetherion/CREDITS-LPC.txt;
        default_type text/plain;
    }

    # O .git do clone e qualquer dotfile ficam fora da web.
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/aetherion.access.log;
    error_log  /var/log/nginx/aetherion.error.log;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name srv1927329.hstgr.cloud;

    # Deixa o caminho do ACME livre para a renovação do certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
